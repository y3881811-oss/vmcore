name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 初始化环境，跳过默认安装废弃的 tools
      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3
        with:
          packages: '' 

      # 手动全量安装 + 自动接受协议
      - name: Install NDK, CMake and Platform Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $ENCODED_STRING | base64 -d > app/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Set Version Variables
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            SUFFIX="daily-$(date +'%Y%m%d')"
            TAG_NAME="v-${SUFFIX}"
            RELEASE_NAME="每日自动构建 ${SUFFIX}"
            IS_PRE=true
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SUFFIX="manual-$(date +'%Y%m%d-%H%M')"
            TAG_NAME="v-${SUFFIX}"
            RELEASE_NAME="手动触发构建 ${SUFFIX}"
            IS_PRE=true
          else
            SUFFIX="${{ github.ref_name }}"
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="正式发布 ${{ github.ref_name }}"
            IS_PRE=false
          fi
          
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/VMCore-${SUFFIX}.apk
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "SUFFIX=${SUFFIX}" >> $GITHUB_ENV
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "IS_PRE=${IS_PRE}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.SUFFIX }}
          path: app/build/outputs/apk/release/VMCore-*.apk

      - name: Create Release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          files: app/build/outputs/apk/release/VMCore-*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.IS_PRE == 'true' }}